<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投递记录与进度</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e3e2dd;
    --text: #23231f;
    --muted: #7a7a72;
    --accent: #185fa5;
    --accent-soft: #e6f1fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; min-width: 96px;
  }
  .stat .n { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  button, select, input {
    font-family: inherit; font-size: 13px; color: var(--text);
  }
  button {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  button:hover { border-color: #c9c8c2; background: #fbfbf9; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #0c447c; }
  button.danger { color: #a32d2d; }
  input[type="text"], input[type="date"], select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .spacer { flex: 1; }
  .tablebox {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: auto;
  }
  table { border-collapse: collapse; width: 100%; min-width: 1000px; }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 8px 10px; text-align: left; vertical-align: middle;
  }
  th {
    font-size: 12px; font-weight: 500; color: var(--muted);
    background: #fbfbf9; position: sticky; top: 0; cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .arrow { opacity: .35; font-size: 10px; }
  th.active .arrow { opacity: 1; color: var(--accent); }
  tbody tr:hover { background: #fcfcfb; }
  td[contenteditable] { cursor: text; }
  td[contenteditable]:focus { outline: 2px solid var(--accent-soft); background: #fff; }
  td.ed { min-width: 70px; }
  td.num { width: 130px; }
  td.note { min-width: 160px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .tag {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; white-space: nowrap;
  }
  .tag.待投递 { background:#f1efe8; color:#5f5e5a; }
  .tag.已投递 { background:#e6f1fb; color:#185fa5; }
  .tag.笔试中 { background:#eeedfe; color:#534ab7; }
  .tag.面试中 { background:#e1f5ee; color:#0f6e56; }
  .tag.HR面  { background:#faeeda; color:#854f0b; }
  .tag.已offer { background:#eaf3de; color:#3b6d11; }
  .tag.已挂  { background:#fcebeb; color:#a32d2d; }
  select.status { border: none; background: transparent; padding: 2px 4px; cursor: pointer; }
  .due { color: #a32d2d; font-weight: 500; }
  .del {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 15px;
  }
  .del:hover { background: #fcebeb; color: #a32d2d; }
  .foot { margin-top: 14px; color: var(--muted); font-size: 12px; }
  @media (max-width: 640px) {
    body { padding: 16px 12px 48px; }
    .stat { min-width: 80px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>投递记录与进度</h1>
  <div class="sub">数据保存在这台电脑的浏览器里 · 换设备或清缓存前请先导出备份</div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <button class="primary" id="add">+ 新增一行</button>
    <input type="text" id="kw" placeholder="搜索公司 / 岗位 / 备注" style="width:200px">
    <select id="fs">
      <option value="all">全部状态</option>
    </select>
    <div class="spacer"></div>
    <button id="export">导出备份</button>
    <button id="importBtn">导入备份</button>
    <button class="danger" id="clear">清空全部</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="foot">双击单元格即可直接编辑，改动自动保存。点表头可排序。</div>
</div>

<script>
(function () {
  var KEY = 'job-tracker-v1';
  var STATUSES = ['待投递', '已投递', '笔试中', '面试中', 'HR面', '已offer', '已挂'];
  var OPEN = ['待投递', '已投递', '笔试中', '面试中', 'HR面'];
  var COLS = [
    { id: 'company',  label: '公司',   w: 'ed' },
    { id: 'position', label: '岗位',   w: 'ed' },
    { id: 'city',     label: '城市',   w: 'ed' },
    { id: 'channel',  label: '渠道',   w: 'ed' },
    { id: 'date',     label: '投递日期', w: 'num', type: 'date' },
    { id: 'status',   label: '状态',   w: '',  type: 'status' },
    { id: 'followUp', label: '下次跟进', w: 'num', type: 'date' },
    { id: 'note',     label: '备注',   w: 'note' }
  ];

  var data = [];
  var sortKey = 'date', sortDir = 'desc', filter = 'all', kw = '';

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { alert('保存失败，可能是浏览器存储空间已满：' + e.message); }
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  var head = document.getElementById('head');
  var body = document.getElementById('body');
  var statsEl = document.getElementById('stats');

  COLS.forEach(function (c) {
    var th = document.createElement('th');
    th.dataset.id = c.id;
    th.textContent = c.label;
    var sp = document.createElement('span');
    sp.className = 'arrow';
    sp.textContent = ' ↕';
    th.appendChild(sp);
    th.onclick = function () {
      if (sortKey === c.id) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortKey = c.id; sortDir = 'asc'; }
      render();
    };
    head.appendChild(th);
  });
  var thOp = document.createElement('th');
  thOp.textContent = '';
  head.appendChild(thOp);

  var fs = document.getElementById('fs');
  STATUSES.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s; o.textContent = s;
    fs.appendChild(o);
  });

  function visible() {
    var k = kw.trim().toLowerCase();
    return data.filter(function (r) {
      if (filter !== 'all' && r.status !== filter) return false;
      if (!k) return true;
      return ['company', 'position', 'note', 'city', 'channel'].some(function (f) {
        return (r[f] || '').toLowerCase().indexOf(k) !== -1;
      });
    }).sort(function (a, b) {
      var x = a[sortKey] || '', y = b[sortKey] || '';
      if (sortKey === 'status') { x = STATUSES.indexOf(x); y = STATUSES.indexOf(y); }
      if (x < y) return sortDir === 'asc' ? -1 : 1;
      if (x > y) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function renderStats() {
    var total = data.length;
    var open = data.filter(function (r) { return OPEN.indexOf(r.status) !== -1; }).length;
    var offer = data.filter(function (r) { return r.status === '已offer'; }).length;
    var dead = data.filter(function (r) { return r.status === '已挂'; }).length;
    var t = today();
    var due = data.filter(function (r) {
      return OPEN.indexOf(r.status) !== -1 && r.followUp && r.followUp <= t;
    }).length;
    var items = [
      ['总数', total], ['进行中', open], ['已 offer', offer], ['已挂', dead], ['今日待跟进', due]
    ];
    statsEl.innerHTML = '';
    items.forEach(function (it) {
      var d = document.createElement('div');
      d.className = 'stat';
      var n = document.createElement('div');
      n.className = 'n';
      n.textContent = it[1];
      if (it[0] === '今日待跟进' && it[1] > 0) n.style.color = '#a32d2d';
      var l = document.createElement('div');
      l.className = 'l';
      l.textContent = it[0];
      d.appendChild(n); d.appendChild(l);
      statsEl.appendChild(d);
    });
  }

  function render() {
    renderStats();
    Array.prototype.forEach.call(head.children, function (th) {
      th.classList.toggle('active', th.dataset.id === sortKey);
      var a = th.querySelector('.arrow');
      if (a && th.dataset.id === sortKey) a.textContent = sortDir === 'asc' ? ' ↑' : ' ↓';
      else if (a) a.textContent = ' ↕';
    });

    var rows = visible();
    body.innerHTML = '';
    if (!rows.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = COLS.length + 1;
      td.className = 'empty';
      td.textContent = data.length ? '没有匹配的记录' : '还没有记录，点上面「新增一行」开始';
      tr.appendChild(td); body.appendChild(tr);
      return;
    }

    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      COLS.forEach(function (c) {
        var td = document.createElement('td');
        if (c.w) td.className = c.w;
        if (c.type === 'date') {
          var inp = document.createElement('input');
          inp.type = 'date';
          inp.value = r[c.id] || '';
          inp.style.width = '100%';
          inp.onchange = function () { r[c.id] = inp.value; r.updated = today(); save(); renderStats(); render(); };
          td.appendChild(inp);
        } else if (c.type === 'status') {
          var sel = document.createElement('select');
          sel.className = 'status';
          STATUSES.forEach(function (s) {
            var o = document.createElement('option');
            o.value = s; o.textContent = s;
            if (r.status === s) o.selected = true;
            sel.appendChild(o);
          });
          sel.onchange = function () { r.status = sel.value; r.updated = today(); save(); renderStats(); render(); };
          var tag = document.createElement('span');
          tag.className = 'tag ' + (r.status || '待投递');
          tag.appendChild(sel);
          td.appendChild(tag);
        } else {
          td.contentEditable = 'true';
          td.textContent = r[c.id] || '';
          td.oninput = function () { r[c.id] = td.textContent; r.updated = today(); save(); };
          td.onblur = function () { renderStats(); };
        }
        tr.appendChild(td);
      });
      var op = document.createElement('td');
      op.style.textAlign = 'right';
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.title = '删除这一行';
      del.onclick = function () {
        if (!confirm('确定删除「' + (r.company || '未命名') + '」这条记录？')) return;
        data = data.filter(function (x) { return x.id !== r.id; });
        save(); render();
      };
      op.appendChild(del);
      tr.appendChild(op);
      body.appendChild(tr);
    });
  }

  document.getElementById('add').onclick = function () {
    data.unshift({
      id: uid(), company: '', position: '', city: '', channel: '',
      date: today(), status: '待投递', followUp: '', note: '', updated: today()
    });
    save(); render();
    var first = body.querySelector('tr td[contenteditable]');
    if (first) first.focus();
  };

  document.getElementById('kw').oninput = function (e) { kw = e.target.value; render(); };
  document.getElementById('fs').onchange = function (e) { filter = e.target.value; render(); };

  document.getElementById('export').onclick = function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'job-tracker-' + today() + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  var fileInput = document.getElementById('file');
  document.getElementById('importBtn').onclick = function () { fileInput.click(); };
  fileInput.onchange = function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var arr = JSON.parse(rd.result);
        if (!Array.isArray(arr)) throw new Error('格式不是数组');
        var mode = confirm('点「确定」= 合并到现有数据（同 id 覆盖）\n点「取消」= 完全替换现有数据');
        if (mode) {
          var map = {};
          data.forEach(function (r) { map[r.id] = r; });
          arr.forEach(function (r) {
            if (!r.id) r.id = uid();
            map[r.id] = Object.assign({}, map[r.id], r);
          });
          data = Object.keys(map).map(function (k) { return map[k]; });
        } else {
          arr.forEach(function (r) { if (!r.id) r.id = uid(); });
          data = arr;
        }
        save(); render();
        alert('导入完成，共 ' + data.length + ' 条');
      } catch (err) { alert('导入失败：' + err.message); }
      fileInput.value = '';
    };
    rd.readAsText(f);
  };

  document.getElementById('clear').onclick = function () {
    if (!data.length) return;
    if (!confirm('会删掉全部 ' + data.length + ' 条记录，建议先导出备份。确定继续？')) return;
    if (!confirm('再确认一次：真的清空？')) return;
    data = []; save(); render();
  };

  data = load();
  render();
})();
</script>
</body>
</html>
